<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پنل مدیریت - کافه آکاتسوکی</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Tahoma', 'Arial', sans-serif;
            background: linear-gradient(135deg, #1a1a1a 0%, #0d0d0d 100%);
            color: #fff;
            min-height: 100vh;
        }

        .header {
            background: linear-gradient(135deg, rgba(220, 38, 38, 0.3) 0%, rgba(0, 0, 0, 0.9) 100%);
            padding: 30px 20px;
            text-align: center;
            border-bottom: 3px solid #dc2626;
        }

        .header h1 {
            color: #dc2626;
            font-size: 2em;
            margin-bottom: 10px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        /* تب‌ها */
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            border-bottom: 2px solid #dc2626;
            padding-bottom: 10px;
        }

        .tab-btn {
            padding: 12px 25px;
            background: transparent;
            border: 2px solid #dc2626;
            color: #fff;
            border-radius: 8px 8px 0 0;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 1em;
        }

        .tab-btn.active {
            background: #dc2626;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* کنترل‌ها */
        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 25px;
            border: 2px solid #dc2626;
            background: rgba(220, 38, 38, 0.2);
            color: #fff;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1em;
            transition: all 0.3s;
            font-weight: bold;
        }

        .btn:hover {
            background: rgba(220, 38, 38, 0.4);
            transform: translateY(-2px);
        }

        .btn-primary {
            background: #dc2626;
        }

        .btn-primary:hover {
            background: #ef4444;
        }

        .btn-danger {
            background: #991b1b;
            border-color: #991b1b;
        }

        .btn-danger:hover {
            background: #dc2626;
        }

        /* جدول محصولات */
        .products-table {
            width: 100%;
            background: rgba(30, 30, 30, 0.9);
            border-radius: 10px;
            overflow: hidden;
            border: 2px solid #dc2626;
        }

        .products-table table {
            width: 100%;
            border-collapse: collapse;
        }

        .products-table th {
            background: #dc2626;
            padding: 15px;
            text-align: right;
            font-weight: bold;
        }

        .products-table td {
            padding: 15px;
            border-bottom: 1px solid #333;
        }

        .products-table tr:hover {
            background: rgba(220, 38, 38, 0.1);
        }

        .product-actions {
            display: flex;
            gap: 10px;
        }

        .btn-small {
            padding: 8px 15px;
            font-size: 0.9em;
        }

        /* مودال */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: linear-gradient(135deg, #1a1a1a 0%, #0d0d0d 100%);
            border: 2px solid #dc2626;
            border-radius: 15px;
            padding: 30px;
            max-width: 600px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-content h2 {
            color: #dc2626;
            margin-bottom: 20px;
            text-align: center;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #ccc;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 12px;
            background: rgba(30, 30, 30, 0.9);
            border: 2px solid #444;
            border-radius: 8px;
            color: #fff;
            font-size: 1em;
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: #dc2626;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 100px;
        }

        .modal-actions {
            display: flex;
            gap: 15px;
            margin-top: 25px;
        }

        .modal-actions .btn {
            flex: 1;
        }

        /* سفارشات */
        .order-card {
            background: rgba(30, 30, 30, 0.9);
            border: 2px solid #dc2626;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 15px;
        }

        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid #444;
        }

        .order-status {
            padding: 5px 15px;
            border-radius: 15px;
            font-size: 0.9em;
        }

        .status-pending {
            background: #f59e0b;
            color: #000;
        }

        .status-completed {
            background: #10b981;
            color: #fff;
        }

        .order-items {
            margin-bottom: 15px;
        }

        .order-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #333;
        }

        .order-total {
            text-align: left;
            font-size: 1.3em;
            color: #dc2626;
            font-weight: bold;
        }

        /* QR Code */
        .qr-section {
            text-align: center;
            padding: 40px;
            background: rgba(30, 30, 30, 0.9);
            border: 2px solid #dc2626;
            border-radius: 15px;
            margin-top: 30px;
        }

        .qr-section h2 {
            color: #dc2626;
            margin-bottom: 20px;
        }

        #qrcode {
            display: inline-block;
            padding: 20px;
            background: #fff;
            border-radius: 10px;
            margin: 20px 0;
        }

        /* آمار */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: rgba(30, 30, 30, 0.9);
            border: 2px solid #dc2626;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
        }

        .stat-card h3 {
            color: #dc2626;
            font-size: 2em;
            margin-bottom: 10px;
        }

        .stat-card p {
            color: #aaa;
        }

        @media (max-width: 768px) {
            .products-table {
                overflow-x: auto;
            }

            .tabs {
                flex-wrap: wrap;
            }

            .controls {
                flex-direction: column;
            }

            .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🔐 پنل مدیریت کافه آکاتسوکی</h1>
        <p>مدیریت منو و سفارشات</p>
    </div>

    <div class="container">
        <!-- آمار -->
        <div class="stats-grid">
            <div class="stat-card">
                <h3 id="totalProducts">0</h3>
                <p>تعداد محصولات</p>
            </div>
            <div class="stat-card">
                <h3 id="totalOrders">0</h3>
                <p>تعداد سفارشات</p>
            </div>
            <div class="stat-card">
                <h3 id="totalRevenue">0</h3>
                <p>درآمد کل (تومان)</p>
            </div>
        </div>

        <!-- تب‌ها -->
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('products')">📦 محصولات</button>
            <button class="tab-btn" onclick="switchTab('orders')">🛒 سفارشات</button>
            <button class="tab-btn" onclick="switchTab('qr')">📱 QR Code</button>
        </div>

        <!-- تب محصولات -->
        <div class="tab-content active" id="productsTab">
            <div class="controls">
                <button class="btn btn-primary" onclick="openAddModal()">➕ اضافه کردن محصول</button>
                <button class="btn" onclick="exportData()">💾 خروجی JSON</button>
                <button class="btn" onclick="importData()">📥 ورودی JSON</button>
            </div>

            <div class="products-table">
                <table>
                    <thead>
                        <tr>
                            <th>نام</th>
                            <th>دسته‌بندی</th>
                            <th>قیمت</th>
                            <th>عملیات</th>
                        </tr>
                    </thead>
                    <tbody id="productsTableBody"></tbody>
                </table>
            </div>
        </div>

        <!-- تب سفارشات -->
        <div class="tab-content" id="ordersTab">
            <div id="ordersContainer"></div>
        </div>

        <!-- تب QR Code -->
        <div class="tab-content" id="qrTab">
            <div class="qr-section">
                <h2>📱 QR Code منوی مشتری</h2>
                <p>این کد را چاپ کنید و روی میزها قرار دهید</p>
                <div id="qrcode"></div>
                <p style="margin-top: 20px; color: #aaa;">
                    لینک منو: <span id="menuUrl" style="color: #dc2626;"></span>
                </p>
                <button class="btn btn-primary" onclick="generateQR()" style="margin-top: 20px;">تولید QR Code</button>
            </div>
        </div>
    </div>

    <!-- مودال محصول -->
    <div class="modal" id="productModal">
        <div class="modal-content">
            <h2 id="modalTitle">اضافه کردن محصول جدید</h2>
            <form id="productForm">
                <input type="hidden" id="productId">
                <div class="form-group">
                    <label>نام محصول *</label>
                    <input type="text" id="productName" required>
                </div>
                <div class="form-group">
                    <label>دسته‌بندی *</label>
                    <select id="productCategory" required>
                        <option value="نوشیدنی گرم">نوشیدنی گرم</option>
                        <option value="نوشیدنی سرد">نوشیدنی سرد</option>
                        <option value="دسر">دسر</option>
                        <option value="غذا">غذا</option>
                        <option value="ویژه">ویژه</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>توضیحات</label>
                    <textarea id="productDescription"></textarea>
                </div>
                <div class="form-group">
                    <label>قیمت (تومان) *</label>
                    <input type="number" id="productPrice" required>
                </div>
                <div class="form-group">
                    <label>ایموجی/آیکون</label>
                    <input type="text" id="productEmoji" placeholder="☕" maxlength="2">
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn" onclick="closeModal()">انصراف</button>
                    <button type="submit" class="btn btn-primary">ذخیره</button>
                </div>
            </form>
        </div>
    </div>

    <!-- مودال ورودی JSON -->
    <div class="modal" id="importModal">
        <div class="modal-content">
            <h2>ورود داده از JSON</h2>
            <div class="form-group">
                <label>داده JSON را اینجا پیست کنید</label>
                <textarea id="importData" style="min-height: 200px;"></textarea>
            </div>
            <div class="modal-actions">
                <button type="button" class="btn" onclick="closeImportModal()">انصراف</button>
                <button type="button" class="btn btn-primary" onclick="processImport()">وارد کردن</button>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script>
        let menuItems = JSON.parse(localStorage.getItem('akatsukiMenu')) || [];
        let orders = JSON.parse(localStorage.getItem('akatsukiOrders')) || [];

        function saveData() {
            localStorage.setItem('akatsukiMenu', JSON.stringify(menuItems));
            updateStats();
        }

        function updateStats() {
            document.getElementById('totalProducts').textContent = menuItems.length;
            document.getElementById('totalOrders').textContent = orders.length;
            const revenue = orders.reduce((sum, order) => sum + order.total, 0);
            document.getElementById('totalRevenue').textContent = revenue.toLocaleString();
        }

        function renderProducts() {
            const tbody = document.getElementById('productsTableBody');
            
            if (menuItems.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" style="text-align: center; padding: 40px; color: #666;">محصولی وجود ندارد</td></tr>';
                return;
            }

            tbody.innerHTML = menuItems.map(item => `
                <tr>
                    <td>${item.emoji || '☕'} ${item.name}</td>
                    <td>${item.category}</td>
                    <td>${item.price.toLocaleString()} تومان</td>
                    <td>
                        <div class="product-actions">
                            <button class="btn btn-small" onclick="editProduct(${item.id})">✏️ ویرایش</button>
                            <button class="btn btn-small btn-danger" onclick="deleteProduct(${item.id})">🗑️ حذف</button>
                        </div>
                    </td>
                </tr>
            `).join('');
        }

        function renderOrders() {
            const container = document.getElementById('ordersContainer');
            
            if (orders.length === 0) {
                container.innerHTML = '<p style="text-align: center; padding: 60px; color: #666;">سفارشی وجود ندارد</p>';
                return;
            }

            container.innerHTML = orders.slice().reverse().map(order => `
                <div class="order-card">
                    <div class="order-header">
                        <div>
                            <strong>سفارش #${order.id}</strong>
                            <p style="color: #aaa; margin-top: 5px;">${order.date}</p>
                        </div>
                        <span class="order-status ${order.status === 'pending' ? 'status-pending' : 'status-completed'}">
                            ${order.status === 'pending' ? 'در انتظار' : 'تکمیل شده'}
                        </span>
                    </div>
                    <div class="order-items">
                        ${order.items.map(item => `
                            <div class="order-item">
                                <span>${item.emoji || '☕'} ${item.name} × ${item.quantity}</span>
                                <span>${(item.price * item.quantity).toLocaleString()} تومان</span>
                            </div>
                        `).join('')}
                    </div>
                    <div class="order-total">
                        جمع کل: ${order.total.toLocaleString()} تومان
                    </div>
                    ${order.status === 'pending' ? `
                        <button class="btn btn-primary" style="margin-top: 15px; width: 100%;" onclick="completeOrder(${order.id})">
                            ✓ تکمیل سفارش
                        </button>
                    ` : ''}
                </div>
            `).join('');
        }

        function switchTab(tab) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            
            document.getElementById(tab + 'Tab').classList.add('active');
            event.target.classList.add('active');

            if (tab === 'orders') renderOrders();
        }

        function openAddModal() {
            document.getElementById('modalTitle').textContent = 'اضافه کردن محصول جدید';
            document.getElementById('productForm').reset();
            document.getElementById('productId').value = '';
            document.getElementById('productModal').classList.add('active');
        }

        function editProduct(id) {
            const item = menuItems.find(i => i.id === id);
            if (item) {
                document.getElementById('modalTitle').textContent = 'ویرایش محصول';
                document.getElementById('productId').value = item.id;
                document.getElementById('productName').value = item.name;
                document.getElementById('productCategory').value = item.category;
                document.getElementById('productDescription').value = item.description || '';
                document.getElementById('productPrice').value = item.price;
                document.getElementById('productEmoji').value = item.emoji || '';
                document.getElementById('productModal').classList.add('active');
            }
        }

        function deleteProduct(id) {
            if (confirm('آیا از حذف این محصول مطمئن هستید؟')) {
                menuItems = menuItems.filter(item => item.id !== id);
                saveData();
                renderProducts();
            }
        }

        function closeModal() {
            document.getElementById('productModal').classList.remove('active');
        }

        document.getElementById('productForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const id = document.getElementById('productId').value;
            const newItem = {
                id: id ? parseInt(id) : Date.now(),
                name: document.getElementById('productName').value,
                category: document.getElementById('productCategory').value,
                description: document.getElementById('productDescription').value,
                price: parseInt(document.getElementById('productPrice').value),
                emoji: document.getElementById('productEmoji').value || '☕'
            };

            if (id) {
                const index = menuItems.findIndex(item => item.id === parseInt(id));
                menuItems[index] = newItem;
            } else {
                menuItems.push(newItem);
            }

            saveData();
            renderProducts();
            closeModal();
        });

        function completeOrder(orderId) {
            const order = orders.find(o => o.id === orderId);
            if (order) {
                order.status = 'completed';
                localStorage.setItem('akatsukiOrders', JSON.stringify(orders));
                renderOrders();
                updateStats();
            }
        }

        function exportData() {
            const dataStr = JSON.stringify(menuItems, null, 2);
            const dataBlob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(dataBlob);
            const link = document.createElement('a');
            link.href = url;
            link.download = 'akatsuki-menu.json';
            link.click();
            URL.revokeObjectURL(url);
        }

        function importData() {
            document.getElementById('importModal').classList.add('active');
        }

        function closeImportModal() {
            document.getElementById('importModal').classList.remove('active');
        }

        function processImport() {
            try {
                const data = JSON.parse(document.getElementById('importData').value);
                if (Array.isArray(data)) {
                    menuItems = data;
                    saveData();
                    renderProducts();
                    closeImportModal();
                    alert('داده‌ها با موفقیت وارد شدند!');
                } else {
                    alert('فرمت داده نامعتبر است!');
                }
            } catch (e) {
                alert('خطا در parsing داده‌ها: ' + e.message);
            }
        }

        function generateQR() {
            const qrContainer = document.getElementById('qrcode');
            const menuUrl = window.location.origin + '/customer.html';
            
            document.getElementById('menuUrl').textContent = menuUrl;
            
            qrContainer.innerHTML = '';
            new QRCode(qrContainer, {
                text: menuUrl,
                width: 250,
                height: 250,
                colorDark: '#dc2626',
                colorLight: '#ffffff'
            });
        }

        window.onclick = function(event) {
            if (event.target.classList.contains('modal')) {
                event.target.classList.remove('active');
            }
        }

        renderProducts();
        updateStats();
    </script>
</body>
</html>
