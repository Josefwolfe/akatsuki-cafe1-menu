<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منوی کافه آکاتسوکی</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Tahoma', 'Arial', sans-serif;
            background: linear-gradient(135deg, #1a1a1a 0%, #0d0d0d 100%);
            color: #fff;
            min-height: 100vh;
            position: relative;
        }

        /* هدر با تصویر کافه */
        .header {
            background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.9)), 
                        url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600"><rect fill="%231a1a1a" width="1200" height="600"/><circle cx="200" cy="300" r="100" fill="%23dc2626" opacity="0.1"/><circle cx="1000" cy="200" r="150" fill="%23dc2626" opacity="0.1"/></svg>');
            background-size: cover;
            padding: 40px 20px;
            text-align: center;
            border-bottom: 3px solid #dc2626;
            position: relative;
        }

        .header::before,
        .header::after {
            content: '☁';
            position: absolute;
            font-size: 80px;
            color: rgba(220, 38, 38, 0.2);
        }

        .header::before {
            top: 10px;
            left: 20px;
        }

        .header::after {
            bottom: 10px;
            right: 20px;
        }

        .header h1 {
            font-size: 2.5em;
            color: #dc2626;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            margin-bottom: 10px;
        }

        .header p {
            color: #ccc;
            font-size: 1.1em;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        /* دسته‌بندی‌ها */
        .categories {
            display: flex;
            gap: 10px;
            margin: 30px 0;
            overflow-x: auto;
            padding: 10px 0;
        }

        .category-btn {
            padding: 12px 25px;
            border: 2px solid #dc2626;
            background: transparent;
            color: #fff;
            border-radius: 25px;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.3s;
            font-size: 1em;
        }

        .category-btn.active,
        .category-btn:hover {
            background: #dc2626;
            transform: scale(1.05);
        }

        /* گرید منو */
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 100px;
        }

        .menu-item {
            background: linear-gradient(135deg, rgba(30, 30, 30, 0.95) 0%, rgba(20, 20, 20, 0.95) 100%);
            border: 2px solid #dc2626;
            border-radius: 15px;
            padding: 20px;
            transition: all 0.3s;
            position: relative;
        }

        .menu-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(220, 38, 38, 0.3);
        }

        .menu-item-image {
            width: 100%;
            height: 180px;
            background: linear-gradient(135deg, #2a2a2a 0%, #1a1a1a 100%);
            border-radius: 10px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4em;
            border: 1px solid #444;
        }

        .menu-item h3 {
            color: #dc2626;
            font-size: 1.4em;
            margin-bottom: 10px;
        }

        .menu-item .description {
            color: #aaa;
            margin-bottom: 15px;
            line-height: 1.6;
            font-size: 0.95em;
        }

        .menu-item .price {
            font-size: 1.6em;
            color: #fff;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .add-to-cart {
            width: 100%;
            padding: 12px;
            background: #dc2626;
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1em;
            font-weight: bold;
            transition: all 0.3s;
        }

        .add-to-cart:hover {
            background: #ef4444;
            transform: scale(1.02);
        }

        /* سبد خرید */
        .cart-icon {
            position: fixed;
            bottom: 30px;
            left: 30px;
            width: 60px;
            height: 60px;
            background: #dc2626;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8em;
            cursor: pointer;
            box-shadow: 0 5px 20px rgba(220, 38, 38, 0.5);
            z-index: 100;
            transition: all 0.3s;
        }

        .cart-icon:hover {
            transform: scale(1.1);
        }

        .cart-badge {
            position: absolute;
            top: -5px;
            right: -5px;
            background: #fff;
            color: #dc2626;
            width: 25px;
            height: 25px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7em;
            font-weight: bold;
        }

        /* مودال سبد خرید */
        .cart-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .cart-modal.active {
            display: flex;
        }

        .cart-content {
            background: linear-gradient(135deg, #1a1a1a 0%, #0d0d0d 100%);
            border: 2px solid #dc2626;
            border-radius: 15px;
            padding: 30px;
            max-width: 500px;
            width: 100%;
            max-height: 80vh;
            overflow-y: auto;
        }

        .cart-content h2 {
            color: #dc2626;
            margin-bottom: 20px;
            text-align: center;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            background: rgba(30, 30, 30, 0.9);
            border-radius: 10px;
            margin-bottom: 10px;
        }

        .cart-item-info {
            flex: 1;
        }

        .cart-item-name {
            color: #fff;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .cart-item-price {
            color: #dc2626;
        }

        .cart-item-controls {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .qty-btn {
            width: 30px;
            height: 30px;
            background: #dc2626;
            border: none;
            border-radius: 5px;
            color: #fff;
            cursor: pointer;
            font-size: 1.2em;
        }

        .cart-total {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 2px solid #dc2626;
            text-align: center;
        }

        .cart-total h3 {
            color: #dc2626;
            font-size: 1.8em;
            margin-bottom: 20px;
        }

        .checkout-btn {
            width: 100%;
            padding: 15px;
            background: #dc2626;
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 1.2em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .checkout-btn:hover {
            background: #ef4444;
        }

        .close-cart {
            position: absolute;
            top: 20px;
            left: 20px;
            background: none;
            border: none;
            color: #fff;
            font-size: 2em;
            cursor: pointer;
        }

        /* پیام خالی */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #666;
            grid-column: 1/-1;
        }

        .empty-state div {
            font-size: 4em;
            margin-bottom: 20px;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.8em;
            }

            .menu-grid {
                grid-template-columns: 1fr;
            }

            .cart-icon {
                bottom: 20px;
                left: 20px;
                width: 50px;
                height: 50px;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>☕ کافه آکاتسوکی ☕</h1>
        <p>تجربه‌ای متفاوت در دنیای قهوه</p>
    </div>

    <div class="container">
        <div class="categories" id="categoriesContainer"></div>
        <div class="menu-grid" id="menuGrid"></div>
    </div>

    <!-- آیکون سبد خرید -->
    <div class="cart-icon" onclick="toggleCart()">
        🛒
        <span class="cart-badge" id="cartBadge">0</span>
    </div>

    <!-- مودال سبد خرید -->
    <div class="cart-modal" id="cartModal">
        <div class="cart-content" style="position: relative;">
            <button class="close-cart" onclick="toggleCart()">×</button>
            <h2>سبد خرید شما</h2>
            <div id="cartItems"></div>
            <div class="cart-total" id="cartTotal" style="display: none;">
                <h3>جمع کل: <span id="totalPrice">0</span> تومان</h3>
                <button class="checkout-btn" onclick="checkout()">ثبت سفارش</button>
            </div>
        </div>
    </div>

    <script>
        let menuItems = JSON.parse(localStorage.getItem('akatsukiMenu')) || [];
        let cart = JSON.parse(localStorage.getItem('akatsukiCart')) || [];
        let currentCategory = 'all';

        function renderMenu() {
            const grid = document.getElementById('menuGrid');
            const filteredItems = currentCategory === 'all' 
                ? menuItems 
                : menuItems.filter(item => item.category === currentCategory);

            if (filteredItems.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state">
                        <div>☕</div>
                        <h3>منو در حال به‌روزرسانی است</h3>
                        <p>لطفاً بعداً مراجعه کنید</p>
                    </div>
                `;
                return;
            }

            grid.innerHTML = filteredItems.map(item => `
                <div class="menu-item">
                    <div class="menu-item-image">${item.emoji || '☕'}</div>
                    <h3>${item.name}</h3>
                    <p class="description">${item.description || ''}</p>
                    <div class="price">${item.price.toLocaleString()} تومان</div>
                    <button class="add-to-cart" onclick="addToCart(${item.id})">افزودن به سبد</button>
                </div>
            `).join('');

            renderCategories();
        }

        function renderCategories() {
            const categories = [...new Set(menuItems.map(item => item.category))];
            const container = document.getElementById('categoriesContainer');
            container.innerHTML = `
                <button class="category-btn ${currentCategory === 'all' ? 'active' : ''}" onclick="filterCategory('all')">همه</button>
                ${categories.map(cat => `
                    <button class="category-btn ${currentCategory === cat ? 'active' : ''}" onclick="filterCategory('${cat}')">${cat}</button>
                `).join('')}
            `;
        }

        function filterCategory(category) {
            currentCategory = category;
            renderMenu();
        }

        function addToCart(itemId) {
            const item = menuItems.find(i => i.id === itemId);
            const existingItem = cart.find(i => i.id === itemId);

            if (existingItem) {
                existingItem.quantity++;
            } else {
                cart.push({ ...item, quantity: 1 });
            }

            saveCart();
            updateCartBadge();
            
            // انیمیشن
            const badge = document.getElementById('cartBadge');
            badge.style.transform = 'scale(1.5)';
            setTimeout(() => badge.style.transform = 'scale(1)', 200);
        }

        function removeFromCart(itemId) {
            cart = cart.filter(i => i.id !== itemId);
            saveCart();
            updateCartBadge();
            renderCart();
        }

        function updateQuantity(itemId, change) {
            const item = cart.find(i => i.id === itemId);
            if (item) {
                item.quantity += change;
                if (item.quantity <= 0) {
                    removeFromCart(itemId);
                } else {
                    saveCart();
                    renderCart();
                    updateCartBadge();
                }
            }
        }

        function saveCart() {
            localStorage.setItem('akatsukiCart', JSON.stringify(cart));
        }

        function updateCartBadge() {
            const totalItems = cart.reduce((sum, item) => sum + item.quantity, 0);
            document.getElementById('cartBadge').textContent = totalItems;
        }

        function toggleCart() {
            const modal = document.getElementById('cartModal');
            modal.classList.toggle('active');
            if (modal.classList.contains('active')) {
                renderCart();
            }
        }

        function renderCart() {
            const cartItemsDiv = document.getElementById('cartItems');
            const cartTotalDiv = document.getElementById('cartTotal');

            if (cart.length === 0) {
                cartItemsDiv.innerHTML = '<p style="text-align: center; color: #666; padding: 40px;">سبد خرید خالی است</p>';
                cartTotalDiv.style.display = 'none';
                return;
            }

            cartItemsDiv.innerHTML = cart.map(item => `
                <div class="cart-item">
                    <div class="cart-item-info">
                        <div class="cart-item-name">${item.name}</div>
                        <div class="cart-item-price">${item.price.toLocaleString()} تومان</div>
                    </div>
                    <div class="cart-item-controls">
                        <button class="qty-btn" onclick="updateQuantity(${item.id}, -1)">-</button>
                        <span>${item.quantity}</span>
                        <button class="qty-btn" onclick="updateQuantity(${item.id}, 1)">+</button>
                    </div>
                </div>
            `).join('');

            const total = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            document.getElementById('totalPrice').textContent = total.toLocaleString();
            cartTotalDiv.style.display = 'block';
        }

        function checkout() {
            const orders = JSON.parse(localStorage.getItem('akatsukiOrders')) || [];
            const newOrder = {
                id: Date.now(),
                items: cart,
                total: cart.reduce((sum, item) => sum + (item.price * item.quantity), 0),
                date: new Date().toLocaleString('fa-IR'),
                status: 'pending'
            };
            orders.push(newOrder);
            localStorage.setItem('akatsukiOrders', JSON.stringify(orders));
            
            cart = [];
            saveCart();
            updateCartBadge();
            toggleCart();
            
            alert('سفارش شما با موفقیت ثبت شد! ☕');
        }

        // بررسی تغییرات منو
        window.addEventListener('storage', function(e) {
            if (e.key === 'akatsukiMenu') {
                menuItems = JSON.parse(e.newValue) || [];
                renderMenu();
            }
        });

        renderMenu();
        updateCartBadge();
    </script>
</body>
</html>
